<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>GlobalBites - Sign Up</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-body">
    <div class="login-wrapper">
        <div class="glow glow-top"></div>
        <div class="glow glow-bottom"></div>

        <div class="login-card">
            <div class="login-header">
                <div class="icon-circle ghost"><span class="material-symbols-outlined">person_add</span></div>
                <h1>Create Account</h1>
                <p>Join GlobalBites for premium dining reservations</p>
            </div>

            <!-- Flash messages -->
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <div class="flash-error">{{ messages[0] }}</div>
                {% endif %}
            {% endwith %}

            <form class="login-form" action="{{ url_for('auth.signup') }}" method="POST">
                <div class="input-group">
                    <label for="full-name">Full Name</label>
                    <div class="input-wrapper">
                        <span class="material-symbols-outlined icon">person</span>
                        <input type="text" id="full-name" name="full_name" placeholder="Enter your full name" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <span class="material-symbols-outlined icon">mail</span>
                        <input type="email" id="email" name="email" placeholder="name@example.com" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="phone">Phone Number</label>
                    <div class="phone-input-wrapper">
                        <span class="material-symbols-outlined icon">call</span>
                        <div class="country-select-container">
                            <select class="country-select" name="country_code" aria-label="Country code">
                                <option value="+961">+961</option>
                                <option value="+1">+1</option>
                                <option value="+44">+44</option>
                                <option value="+20">+20</option>
                                <option value="+33">+33</option>
                                <option value="+49">+49</option>
                                <option value="+91">+91</option>
                                <option value="+966">+966</option>
                                <option value="+971">+971</option>
                                <option value="+90">+90</option>
                            </select>
                            <span class="material-symbols-outlined select-icon">expand_more</span>
                        </div>
                        <div class="divider-line"></div>
                        <input type="tel" id="phone" name="phone" placeholder="03 123 456" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <span class="material-symbols-outlined icon">lock</span>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                        <span class="material-symbols-outlined icon-right" id="toggle-password">visibility_off</span>
                    </div>
                </div>

                <button type="submit" class="btn-primary full-width">
                    Sign Up <span class="material-symbols-outlined">arrow_forward</span>
                </button>
            </form>

            <div class="login-footer">
                <p>Already have an account? <a href="{{ url_for('auth.login') }}">Log In</a></p>
            </div>
        </div>

        <div class="legal-links">
            <a href="#">Privacy Policy</a>
            <a href="#">Terms of Service</a>
        </div>
    </div>

    <script>
        const toggleBtn = document.getElementById('toggle-password');
        const passwordInput = document.getElementById('password');

        toggleBtn.addEventListener('click', function () {
            const isHidden = passwordInput.type === 'password';
            passwordInput.type = isHidden ? 'text' : 'password';
            this.textContent = isHidden ? 'visibility' : 'visibility_off';
        });
    </script>
</body>
</html>
