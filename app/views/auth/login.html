<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>GlobalBites - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-body">
    <div class="login-wrapper">
        <div class="glow glow-top"></div>
        <div class="glow glow-bottom"></div>

        <div class="login-card">
            <div class="login-header">
                <div class="icon-circle ghost"><span class="material-symbols-outlined">restaurant_menu</span></div>
                <h1>Welcome Back</h1>
                <p>Please enter your details to sign in</p>
            </div>

            <!-- Flash messages -->
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <div class="flash-error">{{ messages[0] }}</div>
                {% endif %}
            {% endwith %}

            <form class="login-form" action="{{ url_for('auth.login') }}" method="POST">
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <span class="material-symbols-outlined icon">mail</span>
                        <input type="email" id="email" name="email" placeholder="name@example.com" required>
                    </div>
                </div>

                <div class="input-group">
                    <div class="flex-between">
                        <label for="password">Password</label>
                        <a href="#" class="forgot-link">Forgot Password?</a>
                    </div>
                    <div class="input-wrapper">
                        <span class="material-symbols-outlined icon">lock</span>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                        <span class="material-symbols-outlined icon-right" id="toggle-password">visibility_off</span>
                    </div>
                </div>

                <div class="remember-group">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">Remember me for 30 days</label>
                </div>

                <button type="submit" class="btn-primary full-width">
                    Log In <span class="material-symbols-outlined">arrow_forward</span>
                </button>
            </form>

            <div class="login-footer">
                <p>Don't have an account? <a href="{{ url_for('auth.signup') }}">Sign up for free</a></p>
            </div>
        </div>

        <div class="legal-links">
            <a href="#">Privacy Policy</a>
            <a href="#">Terms of Service</a>
        </div>
    </div>

    <script>
        const toggleBtn = document.getElementById('toggle-password');
        const passwordInput = document.getElementById('password');

        toggleBtn.addEventListener('click', function () {
            const isHidden = passwordInput.type === 'password';
            passwordInput.type = isHidden ? 'text' : 'password';
            this.textContent = isHidden ? 'visibility' : 'visibility_off';
        });
    </script>
</body>
</html>
